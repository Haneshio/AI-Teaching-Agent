<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 教学助手</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>AI 教学助手</h1>
            <p>基于课程资料的 RAG 问答</p>
          </div>
          <span id="healthStatus" class="status-dot offline" title="后端连接状态"></span>
        </header>

        <section class="panel">
          <h2>上传课程资料</h2>
          <form id="uploadForm" class="upload-form">
            <label class="file-picker" for="fileInput">
              <span id="fileName">选择 txt 文件</span>
              <input id="fileInput" type="file" accept=".txt,text/plain" />
            </label>
            <button id="uploadButton" type="submit">上传</button>
          </form>
          <p id="uploadMessage" class="message muted">请先上传一份 txt 课程资料。</p>
        </section>

        <section class="panel">
          <h2>当前资料</h2>
          <div id="documentInfo" class="doc-info empty">暂无资料</div>
        </section>
      </aside>

      <section class="chat-area">
        <div id="chatMessages" class="chat-messages">
          <div class="assistant-message">
            <div class="bubble">
              上传课程资料后，可以直接向我提问。我会尽量基于资料内容回答。
            </div>
          </div>
        </div>

        <form id="chatForm" class="chat-form">
          <textarea
            id="questionInput"
            rows="2"
            placeholder="输入你的问题，例如：这份资料主要讲了什么？"
          ></textarea>
          <button id="sendButton" type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
